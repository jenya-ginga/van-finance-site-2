<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="badgeVan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123A6B"/>
      <stop offset="100%" stop-color="#0B2A50"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="6" y="10" width="80" height="80" rx="20" fill="url(#badgeVan)"/>

  <!-- Van silhouette -->
  <g transform="translate(20,34)">
    <!-- body -->
    <path d="M2 20 L2 10 Q2 6 6 6 L34 6 Q40 6 43 11 L50 20 L50 30 L2 30 Z" fill="#FFFFFF"/>
    <!-- window -->
    <path d="M28 9 L36 9 Q39 9 41 12 L44 17 L28 17 Z" fill="#123A6B"/>
    <!-- wheels -->
    <circle cx="13" cy="31" r="6" fill="#0B2A50" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="41" cy="31" r="6" fill="#0B2A50" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- coin accent -->
    <circle cx="46" cy="2" r="9" fill="#2ED9A3"/>
    <text x="46" y="5.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0B2A50" text-anchor="middle">$</text>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="102" y="46" font-size="30" font-weight="400" fill="#0B2A50">My</text>
    <text x="102" y="76" font-size="34" font-weight="800" fill="#0B2A50">Van<tspan fill="#2ED9A3"> Finance</tspan></text>
  </g>
</svg>
